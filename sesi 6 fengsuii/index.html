<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>FENGSUII SESI 6</title>
</head>

<body>
    <div class="container">
        <nav>
            <a onclick="reRender()" id="home">HOME</a>
            <a onclick="darkMode()" id="mode">MODE</a>
        </nav>
        <h1>Fengsuii Sesi 6</h1>
        <p class="info" id="info"></p>
    </div>

    <script>
        let body = document.body;
        let info = document.getElementById('info');
        let mode = document.getElementById('mode');
        let home = document.getElementById('home');

        const darkLimit = 5;
        let darkCounter = 0;
        let darkRemainingLeft;

        function darkMode() {
            if (darkRemainingLeft == 1) {
                info.textContent = ' darkmode anda telah habis '
                mode.style.display = 'none';
                home.textContent = 'REFRESH';
                return;
            }

            darkCounter += 1;
            darkRemainingLeft = darkLimit - darkCounter;

            info.textContent = `Darkmode di pakai ${darkCounter}x, sisa ${darkRemainingLeft}x`;
            body.classList.toggle("dark");

            if (body.classList.contains("dark")) {
                mode.textContent = 'DARK MODE';
            } else {
                mode.textContent = 'LIGHT MODE';
            }
        }

        function reRender() {
            location.reload();
        }
    </script>
</body>

</html>
